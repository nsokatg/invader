<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インベーダーゲーム</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #000;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ゲームの状態
let score = 0;
let gameOver = false;
let gameClear = false;

// プレイヤー（自機）の設定
const player = {
    x: canvas.width / 2 - 15,
    y: canvas.height - 30,
    width: 30,
    height: 15,
    speed: 5
};

// 弾の設定
let bullets = [];
const bulletSpeed = 7;

// インベーダーの設定
const invaderRows = 3;
const invaderCols = 6;
const invaderWidth = 30;
const invaderHeight = 20;
const invaderPadding = 15;

// インベーダー全体の初期位置と移動速度
let invaderXOffset = 35;
let invaderYOffset = 40;
let invaderDirection = 1; // 1: 右, -1: 左
let invaderSpeed = 1;

let invaders = [];
for (let r = 0; r < invaderRows; r++) {
    invaders[r] = [];
    for (let c = 0; c < invaderCols; c++) {
        invaders[r][c] = { x: 0, y: 0, status: 1 };
    }
}

// キー入力の監視
let rightPressed = false;
let leftPressed = false;

document.addEventListener("keydown", (e) => {
    if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
    if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
    if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault(); // スペースキーでの画面スクロールを防止
        if (bullets.length < 3 && !gameOver && !gameClear) { 
            bullets.push({ x: player.x + player.width / 2 - 2, y: player.y });
        }
    }
});

document.addEventListener("keyup", (e) => {
    if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
    if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
});

// 当たり判定の処理
function collisionDetection() {
    let activeInvaders = 0;
    
    for (let r = 0; r < invaderRows; r++) {
        for (let c = 0; c < invaderCols; c++) {
            let inv = invaders[r][c];
            if (inv.status === 1) {
                activeInvaders++;
                
                // 弾とインベーダーの衝突判定
                for (let b = 0; b < bullets.length; b++) {
                    if (bullets[b].x > inv.x && bullets[b].x < inv.x + invaderWidth &&
                        bullets[b].y > inv.y && bullets[b].y < inv.y + invaderHeight) {
                        inv.status = 0; // 撃破
                        bullets.splice(b, 1); // 弾を消す
                        score += 10;
                        b--;
                    }
                }
                
                // 自機の位置まで侵略されたらゲームオーバー
                if (inv.y + invaderHeight > player.y) {
                    gameOver = true;
                }
            }
        }
    }
    
    // すべて倒したらクリア
    if (activeInvaders === 0) {
        gameClear = true;
    }
}

// 描画と更新のメインループ
function draw() {
    // 画面全体をクリア
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "30px sans-serif";
        ctx.fillText("GAME OVER", canvas.width / 2 - 90, canvas.height / 2);
        ctx.font = "20px sans-serif";
        ctx.fillText(`Score: ${score}`, canvas.width / 2 - 40, canvas.height / 2 + 40);
        return;
    }

    if (gameClear) {
        ctx.fillStyle = "cyan";
        ctx.font = "30px sans-serif";
        ctx.fillText("GAME CLEAR!", canvas.width / 2 - 95, canvas.height / 2);
        ctx.font = "20px sans-serif";
        ctx.fillText(`Score: ${score}`, canvas.width / 2 - 40, canvas.height / 2 + 40);
        return;
    }

    // スコア描画
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText("Score: " + score, 10, 25);

    // 自機の描画
    ctx.fillStyle = "#00ff00"; // 緑
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // 自機の移動
    if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
    if (leftPressed && player.x > 0) player.x -= player.speed;

    // 弾の描画と移動
    ctx.fillStyle = "#ffff00"; // 黄
    for (let i = 0; i < bullets.length; i++) {
        bullets[i].y -= bulletSpeed;
        ctx.fillRect(bullets[i].x, bullets[i].y, 4, 10);
        if (bullets[i].y < 0) {
            bullets.splice(i, 1);
            i--;
        }
    }

    // インベーダーの座標更新と描画
    let changeDirection = false;
    
    for (let r = 0; r < invaderRows; r++) {
        for (let c = 0; c < invaderCols; c++) {
            // 各インベーダーの現在位置を正確に計算して保持
            let invaderX = c * (invaderWidth + invaderPadding) + invaderXOffset;
            let invaderY = r * (invaderHeight + invaderPadding) + invaderYOffset;
            
            invatorsX = invaderX; 
            invaders[r][c].x = invaderX;
            invaders[r][c].y = invaderY;

            if (invaders[r][c].status === 1) {
                ctx.fillStyle = "#ff0000"; // 赤
                ctx.fillRect(invaderX, invaderY, invaderWidth, invaderHeight);

                // 画面の左右の端に達したかどうかの判定
                if (invaderX + invaderWidth > canvas.width - 10 && invaderDirection === 1) {
                    changeDirection = true;
                } else if (invaderX < 10 && invaderDirection === -1) {
                    changeDirection = true;
                }
            }
        }
    }

    // 端に当たっていたら向きを変えて一段下げる
    if (changeDirection) {
        invaderDirection *= -1;
        invaderYOffset += 15;
        invaderSpeed += 0.15; // ターンするたびに少し加速
    } else {
        invaderXOffset += invaderSpeed * invaderDirection;
    }

    collisionDetection();

    requestAnimationFrame(draw);
}

// ゲームスタート
draw();
</script>

</body>
</html>
